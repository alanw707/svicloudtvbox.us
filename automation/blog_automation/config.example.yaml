# Example configuration for the autonomous blog automation script.
# Copy to config.yaml and adjust for your environment.
apis:
  claude_model_brief: "claude-haiku-4-5-20251001"
  claude_model_outline: "claude-haiku-4-5-20251001"
  claude_model_full: "claude-sonnet-4-20250514"
  claude_model_qa: "claude-haiku-4-5-20251001"
  openai_embedding: "text-embedding-3-small"

quality:
  min_score: 80
  duplicate_threshold: 0.85
  min_length: 4000
  outline_score_threshold: 0.75
  topic_dedupe_top_n: 35

seo:
  title:
    claude_model: "claude-haiku-4-5-20251001"
    max_length: 32
    min_length_zh: 30
    recent_window: 40
    recent_similarity_threshold: 0.8
    normalize_drop_tokens:
      - "svicloud"
      - "小雲"
      - "小云"
      - "10p+"
      - "10p"
      - "10s"
      - "tvbox"
      - "tv box"
      - "電視盒"
      - "电视盒"
    overused_tokens:
      - "4K"
      - "HDR"
      - "Wi-Fi"
      - "Dolby"
    disallowed_tokens:
      - "4K"
    allow_disallowed_for_topic_types:
      - "comparison"
    fallback_templates:
      - "{keyword}｜{geo}家庭影音攻略"
      - "{keyword} 在{geo}怎麼選？{descriptor}一次看"
      - "{keyword} 實測心得：{benefit} 全解析"
      - "{keyword} {descriptor}：安裝、售後與服務整理"
      - "選購{keyword}前必看：{benefit} × {descriptor}"
      - "{keyword}｜{geo}家庭影音常見問題"
      - "{geo}華人家庭推薦：{keyword} {descriptor}"
      - "{keyword} 使用指南：{descriptor}+{benefit}"
    benefits:
      - "Wi-Fi 6 雙頻"
      - "中文客服"
      - "美國倉儲快速出貨"
      - "一年美國保固"
      - "語音搜尋"
      - "App 市集"
      - "遠端安裝協助"
      - "本地維修支援"
publishing:
  staging_hold_hours: 24
  max_posts_per_week: 2
  max_posts_per_run: 1
  timezone: "America/Los_Angeles"
  topic_type_priority:
    - "comparison"
    - "service"
    - "campaign"
    - "geo"
    - "faq"
    - "pillar"
  angle_rotation:
    enabled: true
    recent_window: 20
    allow:
      - "legal"
      - "upgrade"
      - "comparison"
      - "usage"
      - "service"
      - "geo"
      - "campaign"
      - "faq"
      - "pillar"
    deny: []
  schedule:
    - day: "Tuesday"
      time: "09:00"
    - day: "Saturday"
      time: "09:00"

wordpress:
  url: "https://svicloudtvbox.us"
  method: "rest-api"  # or wp-cli
  rest:
    username: "content-bot@svicloudtvbox.us"
    password_env: "WP_REST_PASSWORD"
    endpoint: "https://svicloudtvbox.us/wp-json/wp/v2/posts"
    status: "draft"
    author: 2
  category_map:
    default:
      - 24
    comparison:
      - 22
      - 24
    service:
      - 24
    geo:
      - 24
    faq:
      - 24
    campaign:
      - 24

storage:
  db_path: "posts_history.db"
  github_backup:
    enabled: false
    repo: ""
    branch: "main"
    token_env: "GITHUB_TOKEN"

brand_voice:
  tone: "專業且友善，強調影音體驗與美國本地客服/保固"
  max_enforced_key_phrases: 2
  key_phrases:
    - "4K HDR 串流與 Dolby Audio 影音體驗"
    - "Wi-Fi 6 雙頻與 128GB 儲存讓長時間追劇依舊順暢"
    - "中英雙語介面與一年美國保固"
  product_terms:
    - "小雲電視盒"
    - "SVICLOUD 10P+"
    - "SVICLOUD 10S"

content_inputs:
  keyword_source: "../../claudedocs/chinese-keyword-ranking-strategy-nov-2025.md"
  seed_keywords:
    - keyword: "小雲盒子詐騙"
      base_score: 96
      volume_estimate: 260
      intent: "reputation"
      suggested_angle: "用中立角度解釋常見詐騙手法、如何辨識授權經銷/付款安全/保固。"
    - keyword: "小雲盒子節目表"
      base_score: 93
      volume_estimate: 240
      intent: "how-to"
      suggested_angle: "節目表/頻道更新/地區差異與常見查詢方式。"
    - keyword: "小雲電視盒vs安博"
      base_score: 94
      volume_estimate: 230
      intent: "comparison"
      suggested_angle: "以網路穩定性/畫質/售後/保固與美國在地服務做比較。"
    - keyword: "小雲盒子官網"
      base_score: 92
      volume_estimate: 210
      intent: "navigational"
      suggested_angle: "官方購買管道、授權、保固與避免買到仿品。"
    - keyword: "小雲電視盒不能看"
      base_score: 95
      volume_estimate: 250
      intent: "troubleshooting"
      suggested_angle: "不能看/卡頓/連線問題的排查流程（路由器、DNS、更新、重置）。"
    - keyword: "小雲盒子yogurt tv怎麼下載"
      base_score: 92
      volume_estimate: 220
      intent: "how-to"
      suggested_angle: "如何下載/安裝/更新與常見安裝失敗原因。"
  gsc:
    path: "data/gsc_topics.json"
    auto_refresh: false
    site: "https://svicloudtvbox.us/"
    credentials: "../../secrets/your-gsc-service-account.json"
    lookback_days: 30
    limit: 200
    min_impressions: 1
    max_position: 50
  locale_targets:
    - "加州"
    - "紐約"
    - "德州"
  angle_rules:
    legal:
      - "合法"
      - "法律"
      - "合規"
      - "授權"
      - "版權"
      - "違法"
      - "legal"
      - "law"
      - "compliance"
    comparison:
      - "vs"
      - "比較"
      - "對比"
      - "差異"
      - "對照"
      - "PK"
    upgrade:
      - "升級"
      - "更新"
      - "新版"
      - "新款"
      - "新機"
      - "新一代"
      - "改版"
      - "升級版"
      - "新增功能"
      - "upgrade"
      - "new model"
    usage:
      - "安裝"
      - "設定"
      - "教學"
      - "指南"
      - "使用"
      - "怎麼"
      - "如何"
      - "教你"
      - "步驟"
      - "FAQ"
      - "常見問題"
      - "疑難"
      - "故障"
      - "修復"
      - "解決"
      - "技巧"
    service:
      - "保固"
      - "售後"
      - "客服"
      - "退貨"
      - "換貨"
      - "免運"
      - "出貨"
      - "維修"
      - "支援"
  images:
    default:
      - url: "https://svicloudtvbox.us/wp-content/themes/svicloudtvbox-lumen/assets/images/hero-voice-assistant-1200.webp"
        alt: "SVICLOUD 10P+ 4K HDR 旗艦盒"
        caption: "4K HDR 畫質、Dolby Audio 與 Wi-Fi 6 雙頻串流"
  hero_images:
    provider: "openai"
    output_dir: "data/generated_images"
    prompt_template: "在{geo}家庭客廳展示SVICLOUD小雲電視盒，呼應{keyword}主題並凸顯{benefit}。"
    benefits:
      - "4K HDR 畫質"
      - "Wi-Fi 6 穩定串流"
      - "一年保固"
    openai:
      model: "gpt-image-1"
      size: "1024x1024"
  internal_links:
    "方案比較": "https://svicloudtvbox.us/zh/compare/"
    "購買官網": "https://svicloudtvbox.us/zh/"
    "客服支援": "https://svicloudtvbox.us/zh/contact/"
    "常見問題": "https://svicloudtvbox.us/zh/faq/"
  internal_link_targets:
    - label: "SVICLOUD 方案比較"
      url: "https://svicloudtvbox.us/zh/compare/"
      description: "比較 10P+ 與 10S 功能、價格與售後。"
    - label: "SVICLOUD 美國官網"
      url: "https://svicloudtvbox.us/zh/"
      description: "查看現貨狀態與美國地區優惠。"
    - label: "美國客服與售後支援"
      url: "https://svicloudtvbox.us/zh/contact/"
      description: "預約中文客服協助安裝或保固。"
    - label: "SVICLOUD 常見問題"
      url: "https://svicloudtvbox.us/zh/faq/"
      description: "了解設定、付款與保固細節。"
  competitors:
    path: "data/competitor_topics.json"
    base_score: 75
    base_volume: 150
    auto_refresh: false
    min_length: 4
    sites:
      techunblock.com:
        urls:
          - "https://techunblock.com/blog/"
        sitemap: "https://techunblock.com/sitemap_index.xml"
        include_patterns: ["how-to", "guide", "setup", "install", "教學", "安裝", "設定", "下載"]
        max_urls: 80
      svicloudtw.com:
        urls:
          - "https://svicloudtw.com/blog/"
        sitemap: "https://svicloudtw.com/sitemap_index.xml"
        include_patterns: ["how-to", "guide", "setup", "教學", "安裝", "設定", "下載", "節目表"]
        max_urls: 80
      safeprosys.com:
        urls:
          - "https://safeprosys.com/"
        sitemap: "https://safeprosys.com/sitemap_index.xml"
        include_patterns: ["how-to", "guide", "setup", "教學", "安裝", "設定", "下載"]
        max_urls: 80

notifications:
  provider: "smtp"  # or "brevo"
  recipients:
    - "admin@svicloudtvbox.us"
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "alerts@svicloudtvbox.us"
    password_env: "SMTP_PASSWORD"
    use_tls: true
    from_address: "alerts@svicloudtvbox.us"
  brevo:
    api_base: "https://api.brevo.com/v3/smtp/email"
    sender_email: "blogger@svicloudtvbox.us"
    sender_name: "SVICLOUD TV blogger"
    api_key_env: "BREVO_API_KEY"

monitoring:
  log_level: "INFO"
  log_path: "logs/automation.log"
  cron_log_path: "logs/cron.log"
  retention_days: 90

safety:
  dry_run: true
  emergency_stop_file: "EMERGENCY_STOP"
  lock_file: "data/.automation.lock"
  lock_timeout_minutes: 180
