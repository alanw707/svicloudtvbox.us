apis:
  claude_model_brief: "claude-haiku-4-5-20251001"
  claude_model_outline: "claude-haiku-4-5-20251001"
  claude_model_full: "claude-sonnet-4-20250514"
  claude_model_qa: "claude-haiku-4-5-20251001"
  openai_embedding: "text-embedding-3-small"

quality:
  min_score: 80  # Production threshold restored
  duplicate_threshold: 0.85
  min_length: 4000
  outline_score_threshold: 0.75
  topic_dedupe_top_n: 35
  claude_weight: 0.55   # combined QA weighting (0-1)
  claude_floor: 65      # if Claude score falls below this but fallback passes, trust fallback

seo:
  title:
    claude_model: "claude-haiku-4-5-20251001"
    max_length: 32
    min_length_zh: 30
    recent_window: 40
    recent_similarity_threshold: 0.8
    normalize_drop_tokens:
      - "svicloud"
      - "小雲"
      - "小云"
      - "10p+"
      - "10p"
      - "10s"
      - "tvbox"
      - "tv box"
      - "電視盒"
      - "电视盒"
    overused_tokens:
      - "4K"
      - "HDR"
      - "Wi-Fi"
      - "Dolby"
    disallowed_tokens:
      - "4K"
    allow_disallowed_for_topic_types:
      - "comparison"
    fallback_templates:
      - "{keyword}｜{geo}家庭影音攻略"
      - "{keyword} 在{geo}怎麼選？{descriptor}一次看"
      - "{keyword} 實測心得：{benefit} 全解析"
      - "{keyword} {descriptor}：安裝、售後與服務整理"
      - "選購{keyword}前必看：{benefit} × {descriptor}"
      - "{keyword}｜{geo}家庭影音常見問題"
      - "{geo}華人家庭推薦：{keyword} {descriptor}"
      - "{keyword} 使用指南：{descriptor}+{benefit}"
    benefits:
      - "Wi-Fi 6 雙頻"
      - "中文客服"
      - "美國倉儲快速出貨"
      - "一年美國保固"
      - "語音搜尋"
      - "App 市集"
      - "遠端安裝協助"
      - "本地維修支援"
publishing:
  staging_hold_hours: 24
  max_posts_per_week: 2
  max_posts_per_run: 1    # hard single-post runs
  timezone: "America/Los_Angeles"
  topic_type_priority:
    - "comparison"
    - "service"
    - "campaign"
    - "geo"
    - "faq"
    - "pillar"
  angle_rotation:
    enabled: true
    recent_window: 20
    allow:
      - "legal"
      - "upgrade"
      - "comparison"
      - "usage"
      - "service"
      - "geo"
      - "campaign"
      - "faq"
      - "pillar"
    deny: []
  schedule:
    - day: "Tuesday"
      time: "09:00"
    - day: "Saturday"
      time: "09:00"
  base_locale: "zh_TW"
  locale_param: "lang"
  publish_translations: true   # generate translations into meta fields (single-post model)
  locales:
    - "zh_TW"
    - "zh_CN"
    - "en_US"

wordpress:
  url: "https://svicloudtvbox.us"
  method: "rest-api"
  rest:
    endpoint: "https://svicloudtvbox.us/wp-json/wp/v2/posts"
    username: "content-bot@svicloudtvbox.us"
    password_env: "WP_REST_PASSWORD"
    status: "publish"  # Publish when quality + duplicate checks pass
    author: 2
    dedupe_remote: true   # check remote slugs to avoid duplicates
    dedupe_pages: 3       # how many pages of recent posts to scan for slug duplicates
  category_map:
    default:
      - 24    # Guides
    comparison:
      - 22    # Comparisons
      - 24
    service:
      - 24
    geo:
      - 24
    faq:
      - 24
    campaign:
      - 24

storage:
  db_path: "data/posts_history.db"
  github_backup:
    enabled: false
    repo: ""
    branch: "main"
    token_env: "GITHUB_TOKEN"

brand_voice:
  tone: "專業且友善，強調產品體驗與美國本地服務"
  max_enforced_key_phrases: 2
  key_phrases:
    - "SVICLOUD 10P+ 4K HDR 串流與 Dolby Audio 影音體驗"
    - "Wi-Fi 6 雙頻與 128GB 儲存讓長時間追劇依舊順暢"
    - "中文/英文介面與語音搜尋讓長輩也能輕鬆操作"
  product_terms:
    - "小雲電視盒"
    - "SVICLOUD 10P+"
    - "SVICLOUD 10S"
  feature_statements:
    core:
      - "SVICLOUD 10P+ 旗艦盒搭載 4K HDR 與 Dolby Audio，可同時處理 OTT 串流與 IPTV 頻道，畫質與音效勝過一般 Android TV 盒。"
      - "Wi-Fi 6 雙頻與 128GB 儲存結合 AI 智慧快取，讓長時間追劇、錄影備份與 App 切換依舊順暢。"
      - "中英雙語介面、語音搜尋與家長 PIN 保護，讓長輩與孩子都能快速找到想看的節目。"
    comparison:
      - "相較於 EVPAD/UnblockTech 僅有單頻 Wi-Fi，SVICLOUD 10P+ 提供 Wi-Fi 6 + Gigabit Ethernet，4K 串流更穩定。"
      - "SVICLOUD 維持 Google Play 認證與自有 App Hub，可同時安裝 Netflix、Disney+ 與華語專屬應用。"
    geo:
      - "針對 {geo} 用戶，SVICLOUD 10P+ 內建美西/美東內容伺服器節點，華語直播延遲低於 0.8 秒。"
      - "{geo} 家庭可用語音搜尋快速切換 ESPN、HBO Max 與華語頻道，遙控器內建麥克風。"
  cta_title: "下一步：實測 SVICLOUD 旗艦盒"
  cta_points:
    - "預約 4K HDR + Dolby Audio 示範，體驗戲院等級聲畫"
    - "詢問 Wi-Fi 6 擺位與 Mesh 配置，解決卡頓延遲"
    - "請專人遠端設定 App、語言與家長 PIN"
  cta_tagline: "填寫表單或致電 +1 (520) 641-7021，由 SVICLOUD 美國產品顧問提供一對一建議。"

content_inputs:
  keyword_source: "../../claudedocs/chinese-keyword-ranking-strategy-nov-2025.md"
  seed_keywords:
    - keyword: "小雲盒子詐騙"
      base_score: 96
      volume_estimate: 260
      intent: "reputation"
      suggested_angle: "用中立角度解釋常見詐騙手法、如何辨識授權經銷/付款安全/保固。"
    - keyword: "小雲盒子節目表"
      base_score: 93
      volume_estimate: 240
      intent: "how-to"
      suggested_angle: "節目表/頻道更新/地區差異與常見查詢方式。"
    - keyword: "小雲電視盒vs安博"
      base_score: 94
      volume_estimate: 230
      intent: "comparison"
      suggested_angle: "以網路穩定性/畫質/售後/保固與美國在地服務做比較。"
    - keyword: "小雲盒子官網"
      base_score: 92
      volume_estimate: 210
      intent: "navigational"
      suggested_angle: "官方購買管道、授權、保固與避免買到仿品。"
    - keyword: "小雲電視盒不能看"
      base_score: 95
      volume_estimate: 250
      intent: "troubleshooting"
      suggested_angle: "不能看/卡頓/連線問題的排查流程（路由器、DNS、更新、重置）。"
    - keyword: "小雲盒子yogurt tv怎麼下載"
      base_score: 92
      volume_estimate: 220
      intent: "how-to"
      suggested_angle: "如何下載/安裝/更新與常見安裝失敗原因。"
  gsc:
    path: "data/gsc_topics.json"
    auto_refresh: true
    site: "https://svicloudtvbox.us/"
    credentials: "../../secrets/svicloudtvboxus-5b50cc5f2e26.json"
    lookback_days: 30
    limit: 200
    min_impressions: 1
    max_position: 50
  locale_targets:
    - "加州"
    - "紐約"
    - "德州"
  angle_rules:
