name: 🚀 Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Build & Deploy Theme
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6.0.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: 🧪 PHP syntax check
        run: |
          sudo apt-get update -y --quiet
          sudo apt-get install -y --quiet php-cli
          find theme/svicloudtvbox-lumen -name '*.php' -exec php -l {} \;

      - name: 🏗️ Build CSS bundles
        run: python3 scripts/build_css.py --theme svicloudtvbox-lumen

      - name: 🚀 Deploy theme to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PROTOCOL: ftps
          FTP_TLS_CERT_SHA256: 58525e44d56c508c36ca49c1f1404517f3ace7039b5e33782a76d56bdd3cc555
          FTP_SKIP_SAME_SIZE: "0"
          FTP_CONNECT_RETRIES: "6"
          FTP_CONNECT_TIMEOUT: "60"
          LOCAL_THEME_DIR: theme/svicloudtvbox-lumen
          REMOTE_THEME_DIR: public_html/wp-content/themes/svicloudtvbox-lumen
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if python3 scripts/deploy_theme.py \
              --protocol ftps \
              --local-dir "$LOCAL_THEME_DIR" \
              --remote-root "$REMOTE_THEME_DIR" \
              --bust-cache; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "Deploy failed after ${attempt} attempt(s)."
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "Deploy attempt ${attempt} failed; retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: 🧹 Purge CDN Caches
        uses: ./.github/actions/purge-caches
        with:
          wp_lscache_purge_url: ${{ secrets.WP_LSCACHE_PURGE_URL }}
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}
          cf_email: ${{ secrets.CF_EMAIL }}
          cf_api_key: ${{ secrets.CF_API_KEY }}
          site_url: ${{ secrets.SITE_URL }}

      - name: ✅ Verify deployment
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.request

          site_url = os.environ.get('SITE_URL') or 'https://svicloudtvbox.us/'
          request = urllib.request.Request(
              site_url,
              headers={'User-Agent': 'Mozilla/5.0 GitHub-Actions Deploy Verify'},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.getcode()
          except Exception as exc:
              print(f'Verification failed: {exc}', file=sys.stderr)
              raise SystemExit(1)

          print(f'Homepage status: {status}')
          if status not in {200, 301, 302, 403}:
              raise SystemExit(f'Unexpected status {status}')
          print('✅ Site is live')
          PY
