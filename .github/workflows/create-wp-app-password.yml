name: Create WordPress Application Password

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: WordPress site URL
        required: true
        default: https://svicloudtvbox.us
      user_id:
        description: WordPress user ID
        required: true
        default: "2"
      app_name:
        description: Application password label
        required: true
        default: campaign-media-audit
      public_key_b64:
        description: Base64 encoded PEM public key for encrypting the generated credentials
        required: true

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest

    env:
      FTP_CONNECT_RETRIES: "3"
      FTP_CONNECT_TIMEOUT: "60"
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_PROTOCOL: ftps
      FTP_SKIP_SAME_SIZE: "0"
      FTP_TLS_CERT_SHA256: 47e1b5dc5d6102e8ed8c012161af8b225370ab5563b00caf146cbd7a9651e95e
      LOCAL_THEME_DIR: theme/svicloudtvbox-lumen
      REMOTE_THEME_DIR: public_html/wp-content/themes/svicloudtvbox-lumen

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Build temporary WordPress hook
        id: hook
        shell: bash
        env:
          USER_ID: ${{ inputs.user_id }}
          APP_NAME: ${{ inputs.app_name }}
          SITE_URL: ${{ inputs.site_url }}
          PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"
          printf '%s' "$PUBLIC_KEY_B64" | base64 -d > public.pem
          printf 'SITE_URL=%s\nUSER_ID=%s\nAPP_NAME=%s\n' "$SITE_URL" "$USER_ID" "$APP_NAME" > request.env
          python3 - <<'PY' "$TOKEN"
          import pathlib
          import sys

          token = sys.argv[1]
          functions = pathlib.Path("theme/svicloudtvbox-lumen/functions.php")
          with functions.open("a", encoding="utf-8") as fh:
              fh.write(f'''

          // Temporary OpenClaw application-password bootstrap. Removed immediately after use.
          add_action('init', function (): void {{
              $expected_token = '{token}';
              if (!isset($_GET['oc_app_pass_token']) || !hash_equals($expected_token, (string) $_GET['oc_app_pass_token'])) {{
                  return;
              }}

              header('Content-Type: application/json; charset=utf-8');

              $user_id = isset($_GET['user_id']) ? absint($_GET['user_id']) : 0;
              $app_name = isset($_GET['app_name']) ? sanitize_text_field((string) $_GET['app_name']) : '';

              if ($user_id <= 0 || $app_name === '') {{
                  http_response_code(400);
                  echo wp_json_encode(['error' => 'missing_user_or_app']);
                  exit;
              }}

              if (!class_exists('WP_Application_Passwords')) {{
                  http_response_code(500);
                  echo wp_json_encode(['error' => 'application_passwords_unavailable']);
                  exit;
              }}

              $user = get_userdata($user_id);
              if (!$user) {{
                  http_response_code(404);
                  echo wp_json_encode(['error' => 'user_not_found']);
                  exit;
              }}

              $created = WP_Application_Passwords::create_new_application_password($user_id, ['name' => $app_name]);
              if (is_wp_error($created)) {{
                  http_response_code(500);
                  echo wp_json_encode(['error' => $created->get_error_code(), 'message' => $created->get_error_message()]);
                  exit;
              }}

              $password = is_array($created) && isset($created[0]) ? (string) $created[0] : '';
              if ($password === '') {{
                  http_response_code(500);
                  echo wp_json_encode(['error' => 'password_not_returned']);
                  exit;
              }}

              echo wp_json_encode([
                  'WP_REST_ENDPOINT' => home_url('/wp-json'),
                  'WP_REST_USERNAME' => $user->user_login,
                  'WP_REST_PASSWORD' => $password,
              ]);
              exit;
          }}, 0);
          ''')
          PY

      - name: Deploy temporary hook
        shell: bash
        run: python3 scripts/deploy_theme.py --protocol ftps --local-dir "$LOCAL_THEME_DIR" --remote-root "$REMOTE_THEME_DIR" --bust-cache

      - name: Generate and encrypt credentials
        shell: bash
        env:
          HOOK_TOKEN: ${{ steps.hook.outputs.token }}
        run: |
          set -euo pipefail
          source request.env
          URL="${SITE_URL%/}/?oc_app_pass_token=${HOOK_TOKEN}&user_id=${USER_ID}&app_name=$(python3 - <<'PY' "$APP_NAME"
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1]))
          PY
          )"
          curl -fsSL --max-time 30 "$URL" > wp-rest-credentials.json
          python3 - <<'PY'
          import json
          data = json.load(open("wp-rest-credentials.json", encoding="utf-8"))
          required = {"WP_REST_ENDPOINT", "WP_REST_USERNAME", "WP_REST_PASSWORD"}
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f"missing keys: {missing}")
          PY
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -in wp-rest-credentials.json \
            -out wp-rest-credentials.json.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f wp-rest-credentials.json

      - name: Restore clean theme
        if: always()
        shell: bash
        run: |
          git restore theme/svicloudtvbox-lumen/functions.php
          python3 scripts/deploy_theme.py --protocol ftps --local-dir "$LOCAL_THEME_DIR" --remote-root "$REMOTE_THEME_DIR" --bust-cache

      - name: Upload encrypted credential artifact
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wp-rest-credentials-encrypted
          path: wp-rest-credentials.json.enc
          retention-days: 1
