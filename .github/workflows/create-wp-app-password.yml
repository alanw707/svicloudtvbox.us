name: Create WordPress Application Password

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: WordPress site URL
        required: true
        default: https://svicloudtvbox.us
      user_id:
        description: WordPress user ID
        required: true
        default: "2"
      app_name:
        description: Application password label
        required: true
        default: campaign-media-audit
      public_key_b64:
        description: Base64 encoded PEM public key for encrypting the generated credentials
        required: true

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Build one-time helper
        id: helper
        shell: bash
        env:
          USER_ID: ${{ inputs.user_id }}
          APP_NAME: ${{ inputs.app_name }}
          SITE_URL: ${{ inputs.site_url }}
          PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          FILE="oc-create-app-password-${GITHUB_RUN_ID}.php"
          printf 'file=%s\n' "$FILE" >> "$GITHUB_OUTPUT"
          printf 'token=%s\n' "$TOKEN" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' "$FILE" "$TOKEN"
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          token = sys.argv[2]
          path.write_text(f'''<?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');

          $expected_token = '{token}';
          if (!isset($_GET['token']) || !hash_equals($expected_token, (string) $_GET['token'])) {{
              http_response_code(403);
              echo json_encode(['error' => 'forbidden']);
              exit;
          }}

          $wp_load = '';
          $dir = __DIR__;
          for ($i = 0; $i < 6; $i++) {{
              $candidate = $dir . '/wp-load.php';
              if (is_readable($candidate)) {{
                  $wp_load = $candidate;
                  break;
              }}
              $parent = dirname($dir);
              if ($parent === $dir) {{
                  break;
              }}
              $dir = $parent;
          }}

          if (!is_readable($wp_load)) {{
              http_response_code(500);
              echo json_encode(['error' => 'wp_load_missing']);
              exit;
          }}

          require_once $wp_load;

          $user_id = isset($_GET['user_id']) ? absint($_GET['user_id']) : 0;
          $app_name = isset($_GET['app_name']) ? sanitize_text_field((string) $_GET['app_name']) : '';

          if ($user_id <= 0 || $app_name === '') {{
              http_response_code(400);
              echo json_encode(['error' => 'missing_user_or_app']);
              exit;
          }}

          if (!class_exists('WP_Application_Passwords')) {{
              http_response_code(500);
              echo json_encode(['error' => 'application_passwords_unavailable']);
              exit;
          }}

          $user = get_userdata($user_id);
          if (!$user) {{
              http_response_code(404);
              echo json_encode(['error' => 'user_not_found']);
              exit;
          }}

          $created = WP_Application_Passwords::create_new_application_password($user_id, ['name' => $app_name]);
          if (is_wp_error($created)) {{
              http_response_code(500);
              echo json_encode(['error' => $created->get_error_code(), 'message' => $created->get_error_message()]);
              exit;
          }}

          $password = is_array($created) && isset($created[0]) ? (string) $created[0] : '';
          if ($password === '') {{
              http_response_code(500);
              echo json_encode(['error' => 'password_not_returned']);
              exit;
          }}

          echo json_encode([
              'WP_REST_ENDPOINT' => home_url('/wp-json'),
              'WP_REST_USERNAME' => $user->user_login,
              'WP_REST_PASSWORD' => $password,
          ]);
          @unlink(__FILE__);
          ''', encoding='utf-8')
          PY
          printf '%s' "$PUBLIC_KEY_B64" | base64 -d > public.pem
          printf 'SITE_URL=%s\nUSER_ID=%s\nAPP_NAME=%s\n' "$SITE_URL" "$USER_ID" "$APP_NAME" > request.env

      - name: Upload helper over FTPS
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_HELPER_DIR: public_html
          HELPER_FILE: ${{ steps.helper.outputs.file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import os
          import posixpath

          helper = os.environ["HELPER_FILE"]
          remote_dir = os.environ["REMOTE_HELPER_DIR"].strip("/")
          parts = [p for p in remote_dir.split("/") if p]
          with ftplib.FTP_TLS(timeout=60) as ftp:
              ftp.connect(os.environ["FTP_HOST"], 21)
              ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
              ftp.prot_p()
              ftp.set_pasv(True)
              start = ftp.pwd()
              for candidates in (parts, parts[1:] if parts and parts[0] == "public_html" else parts):
                  try:
                      ftp.cwd(start)
                      for part in candidates:
                          ftp.cwd(part)
                      break
                  except Exception:
                      continue
              else:
                  raise RuntimeError(f"unable to enter remote theme directory from {start}")
              with open(helper, "rb") as fh:
                  ftp.storbinary(f"STOR {posixpath.basename(helper)}", fh)
          PY

      - name: Generate and encrypt credentials
        shell: bash
        env:
          HELPER_FILE: ${{ steps.helper.outputs.file }}
          HELPER_TOKEN: ${{ steps.helper.outputs.token }}
        run: |
          set -euo pipefail
          source request.env
          URL="${SITE_URL%/}/${HELPER_FILE}?token=${HELPER_TOKEN}&user_id=${USER_ID}&app_name=$(python3 - <<'PY' "$APP_NAME"
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1]))
          PY
          )"
          curl -fsSL --max-time 30 "$URL" > wp-rest-credentials.json
          python3 - <<'PY'
          import json
          data = json.load(open("wp-rest-credentials.json", encoding="utf-8"))
          required = {"WP_REST_ENDPOINT", "WP_REST_USERNAME", "WP_REST_PASSWORD"}
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f"missing keys: {missing}")
          PY
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -in wp-rest-credentials.json \
            -out wp-rest-credentials.json.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          rm -f wp-rest-credentials.json

      - name: Cleanup helper
        if: always()
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_HELPER_DIR: public_html
          HELPER_FILE: ${{ steps.helper.outputs.file }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          helper = os.environ.get("HELPER_FILE")
          if not helper:
              raise SystemExit(0)
          try:
              with ftplib.FTP_TLS(timeout=60) as ftp:
                  ftp.connect(os.environ["FTP_HOST"], 21)
                  ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
                  ftp.prot_p()
                  ftp.set_pasv(True)
                  parts = [p for p in os.environ["REMOTE_HELPER_DIR"].strip("/").split("/") if p]
                  start = ftp.pwd()
                  for candidates in (parts, parts[1:] if parts and parts[0] == "public_html" else parts):
                      try:
                          ftp.cwd(start)
                          for part in candidates:
                              ftp.cwd(part)
                          break
                      except Exception:
                          continue
                  try:
                      ftp.delete(helper)
                  except Exception:
                      pass
          except Exception:
              pass
          PY

      - name: Upload encrypted credential artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: wp-rest-credentials-encrypted
          path: wp-rest-credentials.json.enc
          retention-days: 1
