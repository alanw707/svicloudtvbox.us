name: 🔍 Code Quality & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  codeql:
    name: 🔍 CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [php, javascript-typescript]
        # PHP covers all .php files (WordPress theme + custom code)
        # javascript-typescript covers any JS/TS in the repo

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Scope to theme + scripts only — exclude vendor/third-party
          config: |
            paths:
              - theme/svicloudtvbox-lumen
              - scripts
            paths-ignore:
              - '**/vendor/**'
              - '**/node_modules/**'
              - '**/*.min.js'
              - '**/*.min.css'

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
