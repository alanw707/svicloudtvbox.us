name: 🔍 Code Quality & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  codeql-javascript:
    name: 🔍 CodeQL Analysis (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.3.1

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v4.35.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # Scope to theme + scripts only — exclude vendor/third-party
          config: |
            paths:
              - theme/svicloudtvbox-lumen
              - scripts
            paths-ignore:
              - '**/vendor/**'
              - '**/node_modules/**'
              - '**/*.min.js'
              - '**/*.min.css'

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4.35.1

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.35.1
        with:
          category: '/language:javascript-typescript'

  codeql-actions:
    name: 🔍 CodeQL Analysis (actions)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4.3.1

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v4.35.1
        with:
          languages: actions
          queries: security-and-quality
          config: |
            paths:
              - .github/workflows
              - .github/actions

      - name: 📊 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.35.1
        with:
          category: '/language:actions'
