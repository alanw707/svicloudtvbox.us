<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 720" width="260" height="720" role="img" aria-labelledby="title desc">
  <title id="title">SVICLOUD remote control</title>
  <desc id="desc">Black voice remote control artwork for SVICLOUD product imagery.</desc>
  <defs>
