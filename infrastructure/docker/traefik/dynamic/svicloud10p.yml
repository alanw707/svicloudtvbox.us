http:
  routers:
    svicloud10p-http:
      rule: "Host(`svicloud10p.svic.local`)"
      service: svicloud10p
      entryPoints:
        - web
    svicloud10p-https:
      rule: "Host(`svicloud10p.svic.local`)"
      service: svicloud10p
      entryPoints:
        - websecure
      tls: {}

  services:
    svicloud10p:
      loadBalancer:
        servers:
          - url: "http://svicloud10p-wp:80"
